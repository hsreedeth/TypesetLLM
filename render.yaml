services:
  - type: web
    name: typesetllm
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /ready
    envVars:
      - key: MAX_REQUEST_BYTES
        value: "1048576"
      - key: MAX_CONCURRENT_CONVERSIONS
        value: "1"
      - key: ALLOW_RAW_TEX
        value: "false"
      - key: TYPESETLLM_PUBLIC_BASE_URL
        value: "https://typesetllm.onrender.com"
      - key: TYPESETLLM_DOWNLOAD_RETENTION_SECONDS
        value: "900"
